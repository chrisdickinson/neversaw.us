{% extends "index.html" %}

{% block content %}
<main>
  <h1>Tags</h1>
  {% if terms %}
  <ul class="tag-list">
    {% for term in terms %}
    <li><a href="{{ term.permalink | safe }}">{{ term.name }}</a> <span class="tag-count">({{ term.pages | length }})</span></li>
    {% endfor %}
  </ul>
  {% endif %}
</main>
{% endblock content %}
